[project]
name = "ros-agent-framework"
version = "0.3.0"
description = "LangGraph agent framework for ROS 2 robots (rclpy in-process, robot-agnostic config)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
agent = [
    "langgraph>=0.2.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-google-genai>=2.0.0",
]

[project.scripts]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]
